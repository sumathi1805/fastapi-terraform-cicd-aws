version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    environment:
      # These match the variable names we echo into the .env file
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  fastapi-app:
    image: ${DOCKER_USER}/fastapi-app:${IMAGE_TAG}
    environment:
      DB_HOST: mysql-db
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    ports:
      - "8000:8000"
    depends_on:
      - mysql-db
    networks:
      - app-network

networks:
  app-network:

volumes:
  mysql-data:
